[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-ai-translator"
version = "0.1.0"
description = "Dual-pipeline AI translation platform with consensus evaluation and audit reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0"
]

[tool.fastapi]
app = "main:app"